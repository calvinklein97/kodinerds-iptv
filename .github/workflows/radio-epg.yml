name: Update Radio Dummy EPG

on:
  schedule:
    # 03:00 UTC = 04:00 CET (Winterzeit) / 05:00 CEST (Sommerzeit).
    # Cron kennt keine Zeitzonen/DST, daher fixer UTC-Wert.
    - cron: '0 3 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'iptv/clean/clean_radio_de.m3u'
      - 'scripts/generate_radio_epg.py'

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate EPG
        run: python scripts/generate_radio_epg.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg/radio_epg.xml
          if git diff --staged --quiet; then
            echo "Keine Aenderungen am EPG."
          else
            git commit -m "chore: update radio dummy EPG"
            git push
          fi
